<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>像素雪票本</title>
<meta name="description" content="奥地利、瑞士、法国、德国雪场的每日雪票和多天通票价格，加上季票回本和滑雪日记。">
<meta name="theme-color" content="#bfe5ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121641" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雪票本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=ZCOOL+KuaiLe&display=swap">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero">
    <div class="mascot" id="mascot"></div>
    <div class="txt">
      <h1>像素雪票本</h1>
      <p id="tagline">阿尔卑斯雪季 · 雪票价格 + 我的雪季记录</p>
    </div>
  </header>

  <div class="install" id="install" hidden></div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-prices" aria-selected="true" data-view="prices"><span id="ico-coin"></span>雪票价格</button>
    <button class="tab" role="tab" id="tab-me" aria-selected="false" data-view="me"><span id="ico-flag"></span>我的雪季</button>
  </nav>

  <section class="panel" id="view-prices" role="tabpanel">
    <div>
      <h2>这一天滑雪要多少钱？</h2>
      <p class="sub">成人门市价。选日期和票种（一日票或多天通票），看各雪场的价格；点雪场展开它整个雪季的价格日历。</p>
    </div>
    <div class="bar">
      <div class="datebox">
        <button class="btn sm ghost" id="prev" aria-label="前一天">◀</button>
        <input type="date" id="date">
        <button class="btn sm ghost" id="next" aria-label="后一天">▶</button>
        <button class="btn sm" id="today">今天</button>
      </div>
      <select id="ticket" aria-label="票种"><option value="1">一日票</option></select>
      <div class="grow"><input type="search" id="q" placeholder="搜雪场：中文、村镇名、拼错也行…" aria-label="搜索雪场"></div>
      <select id="sort" aria-label="排序">
        <option value="asc">便宜优先</option>
        <option value="desc">贵的优先</option>
        <option value="name">按名称</option>
      </select>
    </div>
    <div class="filters" id="states"></div>
    <div class="summary" id="summary"></div>
    <div class="legend" id="legend"></div>
    <div class="list" id="list"><p class="empty">正在加载价格…</p></div>
  </section>

  <section class="panel" id="view-me" role="tabpanel" hidden>
    <div id="me"></div>
  </section>

  <footer id="footer"></footer>
</div>
<dialog class="dlg" id="onboard" aria-label="选择我的通票"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
